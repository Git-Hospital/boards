apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: {name: payments, namespace: demo}
spec:
  hosts: [payments]
  http:
  - route:
    - destination: {host: payments, subset: v3}
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: {name: payments, namespace: demo}
spec:
  host: payments
  subsets:
  - {name: v1, labels: {version: v1}}
