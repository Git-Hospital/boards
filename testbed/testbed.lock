# The one pinned testbed (D18). A run on anything else (another Istio, a
# reused cluster, a changed manifest) is marked standard: false and never
# enters the official table.
#
# Istio stays at 1.24.1, the version the 16 meshmedic-prove proofs and the
# 11 scenarios were measured on, until parity with them is shown (D25). It
# is past end of life; moving to a supported Istio is its own PR after that.
schemaVersion: boards.testbed/v1

kind:
