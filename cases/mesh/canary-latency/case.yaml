id: mesh/canary-latency
track: mesh
kind: fault
set: open
title: Canary subset p99 latency regression
provenance:
  kind: synthetic
  note: converted from scenarios/canary-latency of mesh-incidents-bench (July-August 2026)
author: kassvl
authorRelation: [meshmedic]
contaminatedFor: [meshmedic]
target: {namespace: demo, service: payments, workload: payments-v2}
inject:
  - desc: slow the v2 canary to about 1.2s at p50
    run: [kubectl, -n, demo, set, env, deploy/payments-v2, TIMING_50_PERCENTILE=1200ms, TIMING_90_PERCENTILE=1500ms]
  - run: [kubectl, -n, demo, rollout, status, deploy/payments-v2, --timeout=180s]
reset:
  - run: [kubectl, -n, demo, set, env, deploy/payments-v2, TIMING_50_PERCENTILE=20ms, TIMING_90_PERCENTILE-]
  - run: [kubectl, -n, demo, rollout, status, deploy/payments-v2, --timeout=180s]
cleanTwin:
  checks:
    - promql:
        query: >-
          sum(rate(istio_requests_total{reporter="waypoint", destination_service_name="payments", response_code=~"2.."}[1m]))
          / sum(rate(istio_requests_total{reporter="waypoint", destination_service_name="payments"}[1m]))
        op: ">"
        value: 0.95
oracle:
  promql:
    query: >-
      histogram_quantile(0.99, sum by (le) (rate(istio_request_duration_milliseconds_bucket{reporter="waypoint", destination_service_name="payments", destination_version="v2"}[1m])))
    op: ">"
    value: 1000
settle: 90s
window: 6m
expect:
  alarmWithin: 6m
  resolvesWithin: 6m
  culprits:
    - level: 2
      all: [{kind: Deployment, namespace: demo, name: payments-v2}]
    - level: 1
      all: [{kind: Service, namespace: demo, name: payments}]
  quiet:
    - {kind: Deployment, namespace: demo, name: payments-v1}
    - {kind: Deployment, namespace: demo, name: ledger}
  remediation:
    accept: [traffic-shift, rollback]
    noPatch: fail
    healsWithin: 5m
    reference: {class: traffic-shift, file: fix-traffic-shift.yaml}
rubric: ground-truth.md
