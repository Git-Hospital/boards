id: mesh/client-dns-typo
track: mesh
kind: fault
set: open
title: A client rollout targets a host that does not resolve (NXDOMAIN)
provenance:
  kind: synthetic
  note: converted from scenarios/client-dns-typo of mesh-incidents-bench (July-August 2026)
author: kassvl
authorRelation: [meshmedic]
contaminatedFor: [meshmedic]
target: {namespace: demo, service: payments}
inject:
  - desc: roll loadgen with a target host that does not exist
    run:
      - kubectl
      - -n
      - demo
      - patch
      - deployment
      - loadgen
      - --type=strategic
      - -p
      - '{"spec":{"template":{"spec":{"containers":[{"name":"loadgen","args":["while true; do curl -sS -m 2 -o /dev/null http://payments-svc.demo:9090/; sleep 0.2; done"]}]}}}}'
  - run: [kubectl, -n, demo, rollout, status, deploy/loadgen, --timeout=180s]
reset:
  - desc: restore loadgen's target exactly as payments.yaml ships it
    run:
      - kubectl
      - -n
      - demo
      - patch
      - deployment
      - loadgen
      - --type=strategic
      - -p
      - '{"spec":{"template":{"spec":{"containers":[{"name":"loadgen","args":["while true; do curl -s -o /dev/null http://payments:9090/; sleep 0.2; done"]}]}}}}'
  - run: [kubectl, -n, demo, rollout, status, deploy/loadgen, --timeout=180s]
cleanTwin:
  checks:
    - promql:
        query: >-
          sum(rate(istio_requests_total{reporter="waypoint", destination_service_name="payments", response_code=~"2.."}[1m]))
          / sum(rate(istio_requests_total{reporter="waypoint", destination_service_name="payments"}[1m]))
        op: ">"
        value: 0.95
oracle:
  all:
    - logs:
        namespace: demo
        workload: deploy/loadgen
        since: 90s
        pattern: 'could not resolve|couldn.t resolve|resolve host|name or service not known|temporary failure in name resolution'
    - promql:
        query: >-
          sum(rate(istio_requests_total{reporter="waypoint", destination_service_name="payments", destination_service_namespace="demo"}[1m]))
        op: "<"
        value: 0.1
        noData: holds   # traffic vanishing is the incident itself
settle: 2m
window: 8m
expect:
  alarmWithin: 8m
  resolvesWithin: 6m
  culprits:
    # Pinning the exact field in loadgen's command is checked by the raters
    # for prose; a structured match stops at the workload.
    - level: 2
      all: [{kind: Deployment, namespace: demo, name: loadgen}]
  quiet:
    # Inventing a mesh cause for a healthy, idle payments is the failure
    # this case exists to catch.
    - {kind: Deployment, namespace: demo, name: payments-v1}
    - {kind: Deployment, namespace: demo, name: payments-v2}
    - {kind: VirtualService, namespace: demo, name: payments}
    - {kind: DestinationRule, namespace: demo, name: payments}
    - {kind: PeerAuthentication, namespace: demo, name: default}
  remediation:
    accept: [client-fix]
    forbid: [traffic-shift, outlier-ejection, pool-resize, scoped-permissive, raise-route-timeout]
    noPatch: pass   # a dossier naming the client and its rollout diff is a full answer
    healsWithin: 5m
    reference: {class: client-fix, file: fix-client-fix.yaml}
rubric: ground-truth.md
