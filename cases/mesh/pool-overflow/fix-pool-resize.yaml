# Reference fix: size the payments connection pool for the load instead of
# one connection. The subsets are kept as testbed/mesh/app/payments.yaml
# ships them.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: payments
  namespace: demo
spec:
  host: payments
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 100
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
