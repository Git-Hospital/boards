id: mesh/pool-overflow
track: mesh
kind: fault
set: open
title: Circuit breaker sheds load (UO) from an undersized connection pool
provenance:
  kind: synthetic
  note: converted from scenarios/pool-overflow of mesh-incidents-bench (July-August 2026)
author: kassvl
authorRelation: [meshmedic]
contaminatedFor: [meshmedic]
target: {namespace: demo, service: payments}
inject:
  - desc: slow both subsets and multiply the load
    run: [kubectl, -n, demo, set, env, deploy/payments-v1, TIMING_50_PERCENTILE=300ms]
  - run: [kubectl, -n, demo, set, env, deploy/payments-v2, TIMING_50_PERCENTILE=300ms]
  - run: [kubectl, -n, demo, scale, deploy/loadgen, --replicas=8]
  - desc: clamp the connection pool to one connection
    run:
      - kubectl
      - -n
      - demo
      - patch
      - destinationrule
      - payments
      - --type=merge
      - -p
      - '{"spec":{"trafficPolicy":{"connectionPool":{"tcp":{"maxConnections":1},"http":{"http1MaxPendingRequests":1,"http2MaxRequests":1}}}}}'
  - run: [kubectl, -n, demo, rollout, status, deploy/payments-v1, deploy/payments-v2, --timeout=180s]
reset:
  - run: [kubectl, -n, demo, scale, deploy/loadgen, --replicas=1]
  - run: [kubectl, -n, demo, set, env, deploy/payments-v1, TIMING_50_PERCENTILE=20ms]
  - run: [kubectl, -n, demo, set, env, deploy/payments-v2, TIMING_50_PERCENTILE=20ms]
  - run: [kubectl, -n, demo, patch, destinationrule, payments, --type=json, -p, '[{"op":"remove","path":"/spec/trafficPolicy"}]']
    allowFail: true
  - run: [kubectl, -n, demo, rollout, status, deploy/payments-v1, deploy/payments-v2, --timeout=180s]
cleanTwin:
  checks:
    - promql:
        query: >-
          sum(rate(istio_requests_total{reporter="waypoint", destination_service_name="payments", response_code=~"2.."}[1m]))
          / sum(rate(istio_requests_total{reporter="waypoint", destination_service_name="payments"}[1m]))
        op: ">"
        value: 0.95
oracle:
  promql:
    query: >-
      sum(rate(istio_requests_total{destination_service_name="payments", response_flags="UO"}[1m]))
    op: ">"
    value: 0.1
settle: 120s
window: 6m
expect:
  alarmWithin: 6m
  resolvesWithin: 8m
  culprits:
    - level: 2
      all: [{kind: DestinationRule, namespace: demo, name: payments}]
    - level: 1
      all: [{kind: Service, namespace: demo, name: payments}]
  remediation:
    accept: [pool-resize]
    noPatch: fail
    healsWithin: 5m
rubric: ground-truth.md
