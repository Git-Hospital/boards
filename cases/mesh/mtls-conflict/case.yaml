id: mesh/mtls-conflict
track: mesh
kind: fault
set: open
title: STRICT mTLS rejects a plaintext client outside the mesh (ambient L4)
provenance:
  kind: synthetic
  note: converted from scenarios/mtls-conflict of mesh-incidents-bench (July-August 2026)
author: kassvl
authorRelation: [meshmedic]
contaminatedFor: [meshmedic]
target: {namespace: demo, service: payments}
inject:
  - desc: switch the demo namespace to STRICT mTLS
    run: [kubectl, apply, -f, "-"]
    stdin: |
      apiVersion: security.istio.io/v1
      kind: PeerAuthentication
      metadata:
        name: demo-strict
        namespace: demo
      spec:
        mtls:
          mode: STRICT
  - desc: start a plaintext client outside the mesh
    run: [kubectl, -n, default, run, plain-client, --image=curlimages/curl:8.11.1, --restart=Never, --, sh, -c, "while true; do curl -s -m 2 -o /dev/null http://payments.demo:9090/ ; sleep 1; done"]
    allowFail: true
  - run: [kubectl, -n, default, wait, --for=condition=Ready, pod/plain-client, --timeout=120s]
reset:
  - run: [kubectl, -n, demo, delete, peerauthentication, demo-strict, --ignore-not-found]
  - run: [kubectl, -n, default, delete, pod, plain-client, --ignore-not-found, --grace-period=1]
cleanTwin:
  checks:
    - promql:
        query: >-
          sum(rate(istio_requests_total{reporter="waypoint", destination_service_name="payments", response_code=~"2.."}[1m]))
          / sum(rate(istio_requests_total{reporter="waypoint", destination_service_name="payments"}[1m]))
        op: ">"
        value: 0.95
  # The near miss: the same plaintext client, without STRICT. Its calls
  # succeed, so a tool that alarms on the client's mere presence fails here.
  inject:
    - run: [kubectl, -n, default, run, plain-client, --image=curlimages/curl:8.11.1, --restart=Never, --, sh, -c, "while true; do curl -s -m 2 -o /dev/null http://payments.demo:9090/ ; sleep 1; done"]
      allowFail: true
    - run: [kubectl, -n, default, wait, --for=condition=Ready, pod/plain-client, --timeout=120s]
  reset:
    - run: [kubectl, -n, default, delete, pod, plain-client, --ignore-not-found, --grace-period=1]
oracle:
  all:
    - exists: {kind: pod, namespace: default, name: plain-client}
    - exec:
        namespace: default
        pod: plain-client
        command: [curl, -s, -m, "3", -o, /dev/null, http://payments.demo:9090/]
        holdsWhen: fails
settle: 90s
window: 6m
expect:
  alarmWithin: 6m
  resolvesWithin: 6m
  culprits:
    - level: 2
      all:
        - {kind: PeerAuthentication, namespace: demo, name: demo-strict}
        - {kind: Pod, namespace: default, name: plain-client}
    - level: 1
      all: [{kind: PeerAuthentication, namespace: demo, name: demo-strict}]
    - level: 1
      all: [{kind: Pod, namespace: default, name: plain-client}]
  quiet:
    - {kind: Deployment, namespace: demo, name: payments-v1}
    - {kind: Deployment, namespace: demo, name: payments-v2}
  remediation:
    accept: [enroll-client, scoped-permissive]
    noPatch: fail
    healsWithin: 5m
rubric: ground-truth.md
