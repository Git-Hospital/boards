id: mesh/route-timeout-too-short
track: mesh
kind: fault
set: open
title: A route timeout shorter than the backend's latency (504/UT)
provenance:
  kind: synthetic
  note: converted from scenarios/route-timeout-too-short of mesh-incidents-bench (July-August 2026)
author: kassvl
authorRelation: [meshmedic]
contaminatedFor: [meshmedic]
target: {namespace: demo, service: payments}
inject:
  - desc: set a 10ms route timeout, below the ~20ms backend, keeping the 80/20 split
    run:
      - kubectl
      - -n
      - demo
      - patch
      - virtualservice
      - payments
      - --type=merge
      - -p
      - '{"spec":{"http":[{"timeout":"0.01s","route":[{"destination":{"host":"payments","subset":"v1"},"weight":80},{"destination":{"host":"payments","subset":"v2"},"weight":20}]}]}}'
reset:
  - run:
      - kubectl
      - -n
      - demo
      - patch
      - virtualservice
      - payments
      - --type=merge
      - -p
      - '{"spec":{"http":[{"route":[{"destination":{"host":"payments","subset":"v1"},"weight":80},{"destination":{"host":"payments","subset":"v2"},"weight":20}]}]}}'
cleanTwin:
  checks:
    - promql:
        query: >-
          sum(rate(istio_requests_total{reporter="waypoint", destination_service_name="payments", response_code=~"2.."}[1m]))
          / sum(rate(istio_requests_total{reporter="waypoint", destination_service_name="payments"}[1m]))
        op: ">"
        value: 0.95
oracle:
  promql:
    query: >-
      sum(rate(istio_requests_total{reporter="waypoint", destination_service_name="payments", destination_service_namespace="demo", response_flags="UT"}[1m]))
    op: ">"
    value: 0.5
settle: 90s
window: 6m
expect:
  alarmWithin: 6m
  resolvesWithin: 6m
  culprits:
    - level: 2
      all: [{kind: VirtualService, namespace: demo, name: payments}]
  quiet:
    - {kind: Deployment, namespace: demo, name: payments-v1}
    - {kind: Deployment, namespace: demo, name: payments-v2}
  remediation:
    # No safe automatic patch exists without the operator's routing intent;
    # a raised timeout that heals is partial, a backend fix is wrong.
    accept: []
    forbid: [backend-change, restart, scale-up]
    noPatch: pass
    healsWithin: 5m
rubric: ground-truth.md
