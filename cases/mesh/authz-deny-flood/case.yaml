id: mesh/authz-deny-flood
track: mesh
kind: fault
set: open
title: A DENY AuthorizationPolicy rejects a legitimate caller (403)
provenance:
  kind: synthetic
  note: converted from scenarios/authz-deny-flood of mesh-incidents-bench (July-August 2026)
author: kassvl
authorRelation: [meshmedic]
contaminatedFor: [meshmedic]
target: {namespace: demo, service: payments}
inject:
  - desc: deny loadgen's identity at the payments waypoint
    run: [kubectl, apply, -f, "-"]
    stdin: |
      apiVersion: security.istio.io/v1
      kind: AuthorizationPolicy
      metadata:
        name: payments-block-loadgen
        namespace: demo
      spec:
        targetRefs:
          - group: ""
            kind: Service
            name: payments
        action: DENY
        rules:
          - from:
              - source:
                  principals: ["cluster.local/ns/demo/sa/default"]
reset:
  - run: [kubectl, -n, demo, delete, authorizationpolicy, payments-block-loadgen, --ignore-not-found]
cleanTwin:
  checks:
    - promql:
        query: >-
          sum(rate(istio_requests_total{reporter="waypoint", destination_service_name="payments", response_code=~"2.."}[1m]))
          / sum(rate(istio_requests_total{reporter="waypoint", destination_service_name="payments"}[1m]))
        op: ">"
        value: 0.95
oracle:
  promql:
    query: >-
      sum(rate(istio_requests_total{reporter="waypoint", destination_service_name="payments", destination_service_namespace="demo", response_code="403"}[1m]))
    op: ">"
    value: 0.5
settle: 90s
window: 6m
expect:
  alarmWithin: 6m
  resolvesWithin: 6m
  culprits:
    # Full marks: the denying policy, or the denied caller's identity.
    - level: 2
      all: [{kind: AuthorizationPolicy, namespace: demo, name: payments-block-loadgen}]
    - level: 2
      all: [{kind: ServiceAccount, namespace: demo, name: default}]
  quiet:
    - {kind: PeerAuthentication, namespace: demo, name: default}
    - {kind: Deployment, namespace: demo, name: payments-v1}
    - {kind: Deployment, namespace: demo, name: payments-v2}
  remediation:
    # Whether the denial is a mistake is the operator's call. Loosening
    # authorization automatically, or treating it as mTLS, is harmful.
    accept: []
    forbid: [authz-loosen, scoped-allow, scoped-permissive]
    noPatch: pass
    healsWithin: 5m
rubric: ground-truth.md
